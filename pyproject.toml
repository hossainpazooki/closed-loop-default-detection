[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-default-detection"
version = "0.1.0"
description = "CLUE-style closed loop that measures selective-labels default detection on synthetic SMB lending cohorts and finds the PD model's operating frontier."
requires-python = ">=3.10"
# HistGradientBoosting float output shifts across scikit-learn releases, so the
# version is pinned to the one the committed artifacts (seed_sweep_25.csv,
# severity_curve.csv) and the frozen byte-identity baseline were captured under
# (1.9.0). The sibling hackathon repo pins scikit-learn==1.8.0 for its own
# submission artifacts; that difference is intentional, not a mistake.
dependencies = [
    "numpy==2.4.6",
    "pandas>=2.2",
    "scikit-learn==1.9.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
