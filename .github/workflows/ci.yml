name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pinned-repro:
    # Authoritative gate. Reproduces the committed numbers and the frozen
    # byte-identity baseline under the exact provenance environment
    # (scikit-learn 1.9.0 / numpy 2.4.6, Python 3.14). Runs the FULL suite,
    # including the float-exact tests marked `pinned`.
    name: pinned-repro (full suite, pinned deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the default-path identity test reconstructs
          # pre-v3 feedback.py from a git blob, unreachable in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned provenance environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Full test suite (pinned deps, includes float-exact tests)
        run: pytest

  compat:
    # Portability gate. Proves the package installs and broadly works across
    # supported Python versions and OSes with UNPINNED (range) dependencies.
    # The float-exact tests are deselected with `-m "not pinned"` because
    # HistGradientBoosting output shifts across scikit-learn releases by design;
    # exact-number reproduction is the pinned-repro job's responsibility.
    name: compat (ranges) py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the default-path identity test reconstructs
          # pre-v3 feedback.py from a git blob, unreachable in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with range dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test suite (excluding pinned float-exact tests)
        run: pytest -m "not pinned"

  coverage:
    # Coverage of the PUBLIC (synthetic-only) test suite. The private-data fidelity
    # gate cannot run here (no dataset on CI), so cldd/fidelity.py's data-loading path
    # is intentionally uncovered — this is documented, not an oversight. Pinned
    # float-exact tests are deselected, matching the compat philosophy.
    name: coverage (public suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the default-path identity test reconstructs
          # pre-v3 feedback.py from a git blob, unreachable in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage (excluding pinned float-exact tests)
        run: pytest -m "not pinned" --cov=cldd --cov-report=term-missing

  docs:
    # Documentation gate. Builds the Sphinx API reference with warnings-as-errors,
    # the same strict mode Read the Docs uses (.readthedocs.yaml fail_on_warning),
    # so a broken docstring or cross-reference fails CI instead of the hosted build.
    name: docs (sphinx -W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build docs (warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
